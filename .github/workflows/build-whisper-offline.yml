name: Build Whisper Offline Bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-whisper-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git curl ca-certificates libgomp1

      - name: Build whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git
          cd whisper.cpp
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF
          cmake --build build --config Release -j 2

      - name: Download and quantize multilingual base model
        run: |
          cd whisper.cpp
          bash models/download-ggml-model.sh base
          ./build/bin/whisper-quantize models/ggml-base.bin models/ggml-base-q5_1.bin q5_1

      - name: Assemble portable bundle
        run: |
          mkdir -p bundle
          cp whisper.cpp/build/bin/whisper-cli bundle/
          cp whisper.cpp/models/ggml-base-q5_1.bin bundle/
          cp /usr/lib/x86_64-linux-gnu/libgomp.so.1 bundle/ || true
          ldd bundle/whisper-cli || true
          printf '%s\n' 'Offline multilingual Whisper bundle for local transcription.' > bundle/README.txt

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5-offline-linux
          path: bundle/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
